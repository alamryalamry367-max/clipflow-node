name: VOOXOR Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.22.0

      - name: Configure build tools
        run: |
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("fs").writeFileSync(process.env.HOME+"/.bubblewrap/config.json", JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.ANDROID_HOME}))'

      - name: Restore signing key
        working-directory: vooxor-android
        env:
          VOOXOR_KEYSTORE_BASE64: ${{ secrets.VOOXOR_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$VOOXOR_KEYSTORE_BASE64"
          printf '%s' "$VOOXOR_KEYSTORE_BASE64" | base64 --decode > vooxor-upload-v2.keystore
          test -s vooxor-upload-v2.keystore

      - name: Generate Android project
        working-directory: vooxor-android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK and AAB
        working-directory: vooxor-android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD"
          test -n "$BUBBLEWRAP_KEY_PASSWORD"
          chmod +x gradlew
          bubblewrap build

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: VOOXOR-signed-apk-and-aab
          path: |
            vooxor-android/app-release-signed.apk
            vooxor-android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f vooxor-android/vooxor-upload-v2.keystore
